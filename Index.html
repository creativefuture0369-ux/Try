<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06060c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nexus Remind · Creative Future</title>
<style>
/* ============ THEMES ============ */
:root{
  --r:20px;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
body[data-theme="cyber"]{
  --bg:#06060c; --bg2:#0c0c18; --bg3:#111124;
  --accent:#00e5ff; --accent2:#a855f7; --accentRGB:0,229,255;
  --text:#eaeaf5; --muted:#8a8aa8;
  --card:rgba(255,255,255,.045); --cardBrd:rgba(0,229,255,.16);
  --glow:0 0 30px rgba(0,229,255,.35);
}
body[data-theme="sunset"]{
  --bg:#0d0604; --bg2:#170a06; --bg3:#22100a;
  --accent:#ff7a18; --accent2:#ff2e93; --accentRGB:255,122,24;
  --text:#fdeee6; --muted:#a88b7c;
  --card:rgba(255,255,255,.05); --cardBrd:rgba(255,122,24,.18);
  --glow:0 0 30px rgba(255,122,24,.38);
}
body[data-theme="ocean"]{
  --bg:#03080f; --bg2:#071522; --bg3:#0b2033;
  --accent:#14e0c8; --accent2:#3b82f6; --accentRGB:20,224,200;
  --text:#e2f4fb; --muted:#7b98aa;
  --card:rgba(255,255,255,.05); --cardBrd:rgba(20,224,200,.16);
  --glow:0 0 30px rgba(20,224,200,.35);
}
body[data-theme="sakura"]{
  --bg:#0c050a; --bg2:#170a12; --bg3:#23101c;
  --accent:#ff5ea8; --accent2:#c084fc; --accentRGB:255,94,168;
  --text:#fbe9f2; --muted:#a8839a;
  --card:rgba(255,255,255,.05); --cardBrd:rgba(255,94,168,.18);
  --glow:0 0 30px rgba(255,94,168,.35);
}

/* ============ BASE ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg); color:var(--text);
  overflow:hidden; user-select:none;
  -webkit-font-smoothing:antialiased;
  transition:background .6s var(--ease),color .6s var(--ease);
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,textarea{font-family:inherit;}

/* ============ AMBIENT ORBS ============ */
#orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:opacity .6s;}
.orb{
  position:absolute;border-radius:50%;filter:blur(70px);opacity:.4;
  transition:background 1s var(--ease);
  animation:drift 20s ease-in-out infinite;
}
.orb.a{width:300px;height:300px;background:var(--accent);top:-100px;left:-90px;}
.orb.b{width:260px;height:260px;background:var(--accent2);bottom:-80px;right:-80px;animation-delay:-7s;}
.orb.c{width:200px;height:200px;background:var(--accent);top:45%;left:60%;animation-delay:-13s;opacity:.22;}
@keyframes drift{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(40px,-30px) scale(1.15);}
  66%{transform:translate(-30px,35px) scale(.9);}
}

/* ============ SPLASH ============ */
#splash{
  position:fixed;inset:0;z-index:1000;
  background:radial-gradient(circle at 50% 42%,#101024 0%,#05050a 65%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .75s var(--ease),transform .75s var(--ease),filter .75s;
}
#splash.hide{opacity:0;transform:scale(1.18);filter:blur(14px);pointer-events:none;}
.splash-mark{position:relative;width:132px;height:132px;display:grid;place-items:center;margin-bottom:34px;}
.ring{
  position:absolute;border-radius:50%;border:2px solid transparent;
  border-top-color:#00e5ff;border-right-color:rgba(168,85,247,.6);
  animation:spin 1.6s linear infinite;
}
.ring.r1{inset:0;}
.ring.r2{inset:18px;border-top-color:#a855f7;border-right-color:rgba(0,229,255,.5);animation-duration:2.4s;animation-direction:reverse;}
.ring.r3{inset:36px;border-top-color:#fff;border-right-color:transparent;animation-duration:1.1s;opacity:.5;}
@keyframes spin{to{transform:rotate(360deg);}}
.core{
  width:44px;height:44px;border-radius:14px;
  background:linear-gradient(135deg,#00e5ff,#a855f7);
  box-shadow:0 0 40px rgba(0,229,255,.75),0 0 80px rgba(168,85,247,.4);
  animation:corePulse 1.8s var(--spring) infinite;
}
@keyframes corePulse{0%,100%{transform:scale(1) rotate(0deg);}50%{transform:scale(1.16) rotate(45deg);}}
.splash-title{
  font-size:19px;font-weight:200;letter-spacing:.62em;text-transform:uppercase;
  color:#fff;text-indent:.62em;
  animation:titleIn 1.5s var(--ease) .25s both;
}
@keyframes titleIn{from{opacity:0;letter-spacing:1.4em;filter:blur(10px);}to{opacity:1;letter-spacing:.62em;filter:blur(0);}}
.splash-sub{
  margin-top:12px;font-size:10px;letter-spacing:.38em;text-transform:uppercase;
  color:#00e5ff;opacity:0;text-indent:.38em;
  animation:fadeUp .9s var(--ease) .85s both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:.9;transform:translateY(0);}}
.splash-bar{
  margin-top:52px;width:150px;height:2px;border-radius:2px;
  background:rgba(255,255,255,.1);overflow:hidden;
}
.splash-bar i{
  display:block;height:100%;width:0%;border-radius:2px;
  background:linear-gradient(90deg,#00e5ff,#a855f7);
  animation:load 2.1s var(--ease) .15s forwards;
  box-shadow:0 0 12px #00e5ff;
}
@keyframes load{to{width:100%;}}
.splash-brand{
  position:absolute;bottom:calc(38px + env(safe-area-inset-bottom));
  font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:#4a4a63;
  animation:fadeUp 1s var(--ease) 1.3s both;
}

/* ============ APP SHELL ============ */
#app{
  position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  opacity:0;transition:opacity .6s var(--ease);
}
#app.on{opacity:1;}

header{
  padding:calc(14px + env(safe-area-inset-top)) 18px 10px;
  display:flex;align-items:center;gap:12px;
  flex-shrink:0;
}
.brand-logo{
  width:40px;height:40px;border-radius:13px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:18px;color:#04040a;font-weight:900;
  box-shadow:var(--glow);
  animation:logoBreath 3.6s ease-in-out infinite;
}
@keyframes logoBreath{0%,100%{box-shadow:0 0 18px rgba(var(--accentRGB),.35);}50%{box-shadow:0 0 34px rgba(var(--accentRGB),.7);}}
.brand-txt h1{
  font-size:15px;font-weight:700;letter-spacing:.04em;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-txt p{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.hbtn{
  margin-left:auto;width:40px;height:40px;border-radius:13px;
  background:var(--card);border:1px solid var(--cardBrd);
  display:grid;place-items:center;font-size:17px;
  transition:transform .25s var(--spring),background .3s;
}
.hbtn:active{transform:scale(.86);background:rgba(var(--accentRGB),.18);}

/* ---- stats ---- */
.stats{
  margin:4px 18px 12px;padding:14px 16px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--cardBrd);
  display:flex;align-items:center;gap:16px;flex-shrink:0;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  animation:cardIn .6s var(--ease) both;
}
.ring-wrap{position:relative;width:52px;height:52px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);width:52px;height:52px;}
.ring-wrap circle{fill:none;stroke-width:4.5;stroke-linecap:round;}
.ring-bg{stroke:rgba(255,255,255,.09);}
.ring-fg{
  stroke:url(#grad);stroke-dasharray:125.6;stroke-dashoffset:125.6;
  transition:stroke-dashoffset .9s var(--ease);
  filter:drop-shadow(0 0 6px rgba(var(--accentRGB),.8));
}
.ring-pct{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:12px;font-weight:800;color:var(--accent);
}
.stat-txt{flex:1;min-width:0;}
.stat-txt h2{font-size:14px;font-weight:700;letter-spacing:.01em;}
.stat-txt p{font-size:11px;color:var(--muted);margin-top:3px;}
.streak{
  display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:12px;
  background:rgba(var(--accentRGB),.12);border:1px solid var(--cardBrd);
  font-size:12px;font-weight:800;color:var(--accent);
  animation:streakPop .5s var(--spring) both;
}
@keyframes streakPop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}

/* ---- filters ---- */
.filters{
  display:flex;gap:8px;padding:0 18px 12px;overflow-x:auto;flex-shrink:0;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none;}
.chip{
  padding:8px 16px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;
  background:var(--card);border:1px solid var(--cardBrd);color:var(--muted);
  transition:all .3s var(--ease);
}
.chip.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#05050c;border-color:transparent;
  box-shadow:0 4px 18px rgba(var(--accentRGB),.4);
  transform:translateY(-1px);
}
.chip:active{transform:scale(.93);}

/* ---- task list ---- */
#taskList{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:0 18px 150px;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#taskList::-webkit-scrollbar{display:none;}

.task{
  position:relative;display:flex;align-items:flex-start;gap:12px;
  padding:14px 14px 14px 18px;margin-bottom:11px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--cardBrd);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  overflow:hidden;
  animation:cardIn .5s var(--ease) both;
  animation-delay:calc(var(--i,0)*45ms);
  transition:transform .3s var(--spring),opacity .35s,border-color .3s,background .3s;
}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.task::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--pri,var(--accent));
  box-shadow:0 0 14px var(--pri,var(--accent));
}
.task:active{transform:scale(.975);}
.task.p1{--pri:#ff4d6d;}
.task.p2{--pri:#ffb020;}
.task.p3{--pri:#22e39a;}
.task.done{opacity:.42;}
.task.done .t-title{text-decoration:line-through;color:var(--muted);}
.task.leaving{animation:cardOut .35s var(--ease) forwards;}
@keyframes cardOut{to{opacity:0;transform:translateX(70px) scale(.9);height:0;margin:0;padding:0;}}

.check{
  width:26px;height:26px;border-radius:9px;flex-shrink:0;margin-top:2px;
  border:2px solid rgba(255,255,255,.22);
  display:grid;place-items:center;font-size:14px;color:transparent;
  transition:all .3s var(--spring);
}
.task.done .check{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-color:transparent;color:#05050c;transform:scale(1.08);
}
.check:active{transform:scale(.8);}

.t-body{flex:1;min-width:0;}
.t-title{font-size:14.5px;font-weight:600;line-height:1.35;word-break:break-word;}
.t-note{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4;word-break:break-word;}
.t-meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.due{
  font-size:10.5px;font-weight:700;letter-spacing:.03em;
  padding:4px 9px;border-radius:8px;
  background:rgba(var(--accentRGB),.12);color:var(--accent);
  display:inline-flex;align-items:center;gap:4px;
}
.due.soon{background:rgba(255,77,109,.16);color:#ff6b85;animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.45;}}
.badge{
  font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 8px;border-radius:7px;
  background:rgba(255,255,255,.07);color:var(--pri,var(--accent));
}
.del{
  width:30px;height:30px;border-radius:10px;flex-shrink:0;
  display:grid;place-items:center;font-size:13px;color:var(--muted);
  transition:all .25s;
}
.del:active{background:rgba(255,77,109,.2);color:#ff4d6d;transform:scale(.85);}

/* ---- empty ---- */
.empty{
  text-align:center;padding:56px 24px;animation:cardIn .6s var(--ease) both;
}
.empty-ico{
  width:88px;height:88px;margin:0 auto 20px;border-radius:28px;
  background:var(--card);border:1px solid var(--cardBrd);
  display:grid;place-items:center;font-size:36px;
  animation:floaty 3.4s ease-in-out infinite;
  box-shadow:var(--glow);
}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-12px) rotate(3deg);}}
.empty h3{font-size:16px;font-weight:700;margin-bottom:8px;}
.empty p{font-size:12.5px;color:var(--muted);line-height:1.6;max-width:250px;margin:0 auto;}

/* ---- FAB ---- */
#fab{
  position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));
  width:62px;height:62px;border-radius:22px;z-index:50;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:28px;font-weight:300;color:#05050c;
  box-shadow:0 10px 34px rgba(var(--accentRGB),.5),0 0 0 0 rgba(var(--accentRGB),.5);
  transition:transform .3s var(--spring),box-shadow .3s;
  animation:fabPulse 2.6s ease-in-out infinite;
}
@keyframes fabPulse{
  0%,100%{box-shadow:0 10px 34px rgba(var(--accentRGB),.45),0 0 0 0 rgba(var(--accentRGB),.45);}
  50%{box-shadow:0 10px 34px rgba(var(--accentRGB),.45),0 0 0 16px rgba(var(--accentRGB),0);}
}
#fab:active{transform:scale(.88) rotate(90deg);}

/* ============ SHEETS ============ */
.sheet{position:fixed;inset:0;z-index:300;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;}
.sheet .backdrop{
  position:absolute;inset:0;background:rgba(0,0,0,.65);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;transition:opacity .35s var(--ease);
}
.sheet .panel{
  position:relative;width:100%;max-width:540px;max-height:88vh;overflow-y:auto;
  background:var(--bg2);border-top:1px solid var(--cardBrd);
  border-radius:28px 28px 0 0;
  padding:10px 20px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .45s var(--ease);
  scrollbar-width:none;
}
.sheet .panel::-webkit-scrollbar{display:none;}
.sheet.open{pointer-events:auto;}
.sheet.open .backdrop{opacity:1;}
.sheet.open .panel{transform:translateY(0);}
.grabber{width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:0 auto 18px;}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:18px;letter-spacing:.01em;}

.field{margin-bottom:16px;}
.field label{
  display:block;font-size:10.5px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:8px;
}
.field input[type=text],.field input[type=datetime-local],.field textarea{
  width:100%;padding:14px 15px;border-radius:15px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  color:var(--text);font-size:14.5px;outline:none;
  transition:border-color .3s,background .3s,box-shadow .3s;
}
.field textarea{resize:none;min-height:66px;}
.field input:focus,.field textarea:focus{
  border-color:var(--accent);background:rgba(var(--accentRGB),.07);
  box-shadow:0 0 0 3px rgba(var(--accentRGB),.12);
}
.field input::placeholder,.field textarea::placeholder{color:rgba(255,255,255,.22);}

.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.qbtn{
  padding:8px 14px;border-radius:11px;font-size:12px;font-weight:700;
  background:rgba(var(--accentRGB),.1);border:1px solid var(--cardBrd);color:var(--accent);
  transition:all .25s var(--spring);
}
.qbtn:active{transform:scale(.9);background:rgba(var(--accentRGB),.24);}

.pri-row{display:flex;gap:9px;}
.pri-opt{
  flex:1;padding:12px 6px;border-radius:14px;text-align:center;
  font-size:11.5px;font-weight:800;letter-spacing:.05em;
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);
  color:var(--muted);transition:all .25s var(--spring);
}
.pri-opt:active{transform:scale(.93);}
.pri-opt.sel{transform:translateY(-2px);}
.pri-opt[data-p="1"].sel{background:rgba(255,77,109,.18);border-color:#ff4d6d;color:#ff6b85;box-shadow:0 6px 20px rgba(255,77,109,.25);}
.pri-opt[data-p="2"].sel{background:rgba(255,176,32,.18);border-color:#ffb020;color:#ffc44d;box-shadow:0 6px 20px rgba(255,176,32,.25);}
.pri-opt[data-p="3"].sel{background:rgba(34,227,154,.18);border-color:#22e39a;color:#3ff0ab;box-shadow:0 6px 20px rgba(34,227,154,.25);}

.btn-main{
  width:100%;padding:16px;border-radius:17px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#05050c;font-size:14.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 10px 30px rgba(var(--accentRGB),.35);
  transition:transform .25s var(--spring),box-shadow .3s;
  margin-top:6px;
}
.btn-main:active{transform:scale(.96);box-shadow:0 4px 14px rgba(var(--accentRGB),.3);}
.btn-ghost{
  width:100%;padding:14px;border-radius:16px;margin-top:10px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  color:var(--muted);font-size:13px;font-weight:700;
  transition:transform .25s var(--spring),background .25s;
}
.btn-ghost:active{transform:scale(.96);background:rgba(255,255,255,.1);}

/* ---- settings specific ---- */
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;}
.theme-card{
  padding:14px;border-radius:17px;text-align:left;
  background:rgba(255,255,255,.04);border:2px solid rgba(255,255,255,.08);
  transition:all .3s var(--spring);position:relative;overflow:hidden;
}
.theme-card:active{transform:scale(.95);}
.theme-card.sel{border-color:var(--accent);background:rgba(var(--accentRGB),.1);box-shadow:0 8px 26px rgba(var(--accentRGB),.22);}
.theme-dots{display:flex;gap:5px;margin-bottom:9px;}
.theme-dots i{width:16px;height:16px;border-radius:50%;display:block;}
.theme-card span{font-size:12px;font-weight:800;letter-spacing:.02em;}
.theme-card .tick{
  position:absolute;top:10px;right:11px;font-size:13px;color:var(--accent);opacity:0;transform:scale(.4);
  transition:all .3s var(--spring);
}
.theme-card.sel .tick{opacity:1;transform:scale(1);}

.snd-row{display:flex;gap:8px;flex-wrap:wrap;}
.snd{
  flex:1 1 calc(50% - 8px);padding:13px 12px;border-radius:14px;
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.09);
  font-size:12.5px;font-weight:700;color:var(--muted);
  display:flex;align-items:center;gap:8px;
  transition:all .25s var(--spring);
}
.snd:active{transform:scale(.94);}
.snd.sel{background:rgba(var(--accentRGB),.14);border-color:var(--accent);color:var(--accent);}
.snd em{font-style:normal;font-size:15px;}

.set-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:15px 0;border-bottom:1px solid rgba(255,255,255,.06);
}
.set-row:last-of-type{border-bottom:none;}
.set-row .lbl{font-size:13.5px;font-weight:600;}
.set-row .sub{font-size:11px;color:var(--muted);margin-top:2px;}

.switch{
  width:50px;height:29px;border-radius:99px;flex-shrink:0;
  background:rgba(255,255,255,.12);position:relative;transition:background .3s var(--ease);
}
.switch::after{
  content:'';position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:#fff;transition:transform .35s var(--spring),background .3s;
}
.switch.on{background:linear-gradient(135deg,var(--accent),var(--accent2));}
.switch.on::after{transform:translateX(21px);background:#05050c;}

input[type=range]{
  -webkit-appearance:none;width:100%;height:5px;border-radius:5px;outline:none;
  background:rgba(255,255,255,.14);margin-top:12px;
}
